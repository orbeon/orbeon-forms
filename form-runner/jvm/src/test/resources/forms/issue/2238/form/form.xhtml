<?xml version="1.0" encoding="UTF-8"?>
<xh:html
    xmlns:xh="http://www.w3.org/1999/xhtml"
    xmlns:xf="http://www.w3.org/2002/xforms"
    xmlns:xs="http://www.w3.org/2001/XMLSchema"
    xmlns:xxf="http://orbeon.org/oxf/xml/xforms"
    xmlns:fr="http://orbeon.org/oxf/xml/form-runner">
    <xh:head>
        <xh:title>Form-level Detail Page buttons configuration #2238</xh:title>
        <xf:model id="fr-form-model" xxf:expose-xpath-types="true" xxf:analysis.calculate="true">

            <xf:instance id="fr-form-instance" xxf:exclude-result-prefixes="#all" xxf:index="id">
                <form>
                    <section-1>
                        <grid-1>
                            <my-field/>
                            <action-result/>
                            <amount/>
                        </grid-1>
                    </section-1>
                </form>
            </xf:instance>

            <xf:bind id="fr-form-binds" ref="instance('fr-form-instance')">
                <xf:bind id="section-1-bind" name="section-1" ref="section-1">
                    <xf:bind id="grid-1-bind" ref="grid-1" name="grid-1">
                        <xf:bind id="my-field-bind" ref="my-field" name="my-field" xxf:whitespace="trim"/>
                        <xf:bind id="action-result-bind" ref="action-result" name="action-result" xxf:whitespace="trim"/>
                        <xf:bind id="amount-bind" ref="amount" name="amount" type="xf:decimal" xxf:whitespace="trim"/>
                    </xf:bind>
                </xf:bind>
            </xf:bind>

            <xf:instance id="fr-form-metadata" xxf:readonly="true" xxf:exclude-result-prefixes="#all">
                <metadata>
                    <application-name>issue</application-name>
                    <form-name>2238</form-name>
                    <title xml:lang="en">Form-level Detail Page buttons #2238</title>
                    <description xml:lang="en"/>
                    <wizard>true</wizard>
                    <detail-buttons close-uri="/custom/close-target">
                        <bar name="edit">clear save-final approve escalate</bar>
                        <bar name="view">edit</bar>
                        <bar name="inner">validate</bar>
                        <button name="save-final" loading-indicator=""/>
                        <button name="approve" visible="$my-field = ('ready', 'locked')" enabled="$my-field = 'ready'" loading-indicator="modal"/>
                        <button name="escalate" visible="$amount gt 1000" enabled="$amount gt 5000"/>
                    </detail-buttons>
                    <processes>
                        <process name="approve">xf:setvalue(ref = "//action-result", value = "'approved'")</process>
                    </processes>
                    <resources>
                        <resource xml:lang="*">
                            <buttons>
                                <button name="approve" html="true">&lt;i class="fa fa-fw fa-thumbs-up"&gt;&lt;/i&gt; Approve Claim</button>
                                <button name="escalate" html="false">Escalate</button>
                            </buttons>
                        </resource>
                    </resources>
                </metadata>
            </xf:instance>

            <xf:instance id="fr-form-attachments" xxf:exclude-result-prefixes="#all">
                <attachments/>
            </xf:instance>

            <xf:instance xxf:readonly="true" id="fr-form-resources" xxf:exclude-result-prefixes="#all">
                <resources>
                    <resource xml:lang="en">
                        <my-field><label>My Field</label><hint/></my-field>
                        <action-result><label>Action Result</label><hint/></action-result>
                        <amount><label>Amount</label><hint/></amount>
                        <section-1><label>Section 1</label></section-1>
                    </resource>
                </resources>
            </xf:instance>

        </xf:model>
    </xh:head>
    <xh:body>
        <fr:view>
            <fr:body>
                <fr:section id="section-1-section" bind="section-1-bind">
                    <xf:label ref="$form-resources/section-1/label"/>
                    <fr:grid id="grid-1-grid" bind="grid-1-bind">
                        <fr:c y="1" x="1" w="4">
                            <xf:input id="my-field-control" bind="my-field-bind">
                                <xf:label ref="$form-resources/my-field/label"/>
                                <xf:hint ref="$form-resources/my-field/hint"/>
                            </xf:input>
                        </fr:c>
                        <fr:c y="1" x="5" w="4">
                            <xf:input id="action-result-control" bind="action-result-bind">
                                <xf:label ref="$form-resources/action-result/label"/>
                                <xf:hint ref="$form-resources/action-result/hint"/>
                            </xf:input>
                        </fr:c>
                        <fr:c y="1" x="9" w="4">
                            <xf:input id="amount-control" bind="amount-bind">
                                <xf:label ref="$form-resources/amount/label"/>
                                <xf:hint ref="$form-resources/amount/hint"/>
                            </xf:input>
                        </fr:c>
                    </fr:grid>
                </fr:section>
            </fr:body>
        </fr:view>
    </xh:body>
</xh:html>
