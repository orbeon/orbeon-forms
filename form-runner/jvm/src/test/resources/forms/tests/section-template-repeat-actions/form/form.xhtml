<xh:html xmlns:xf="http://www.w3.org/2002/xforms"
         xmlns:xh="http://www.w3.org/1999/xhtml"
         xmlns:xxf="http://orbeon.org/oxf/xml/xforms"
         xmlns:fr="http://orbeon.org/oxf/xml/form-runner"
         xmlns:xs="http://www.w3.org/2001/XMLSchema"
         xmlns:exf="http://www.exforms.org/exf/1-0">
    <xh:head>
        <xf:model id="fr-form-model" xxf:expose-xpath-types="true">

            <xf:instance id="fr-form-instance" xxf:exclude-result-prefixes="#all" xxf:index="id">
                <form>
                    <my-section>
                        <grid-1>
                            <choice/>
                        </grid-1>
                        <rep-grid>
                            <rep-grid-iteration>
                                <rep-control/>
                            </rep-grid-iteration>
                        </rep-grid>
                    </my-section>
                </form>
            </xf:instance>

            <xf:bind id="fr-form-binds" ref="instance('fr-form-instance')">
                <xf:bind id="my-section-bind" ref="my-section" name="my-section"/>
            </xf:bind>

            <xf:instance id="fr-form-metadata" xxf:readonly="true" xxf:exclude-result-prefixes="#all">
                <metadata>
                    <application-name>tests</application-name>
                    <form-name>section-template-repeat-actions</form-name>
                    <title xml:lang="en">Section template actions with repeats</title>
                    <description xml:lang="en"/>
                    <library-versions>
                        <orbeon>1</orbeon>
                        <app>1</app>
                    </library-versions>
                </metadata>
            </xf:instance>

            <xf:instance xxf:readonly="true" id="fr-form-resources" xxf:exclude-result-prefixes="#all">
                <resources>
                    <resource xml:lang="en">
                        <my-section><label>My Section</label></my-section>
                    </resource>
                </resources>
            </xf:instance>

        </xf:model>
        <xbl:xbl xmlns:xbl="http://www.w3.org/ns/xbl" xmlns:p="http://www.orbeon.com/oxf/pipeline">
            <xbl:binding xmlns:component="http://orbeon.org/oxf/xml/form-builder/component/tests/library"
                         id="tests-my-section-component"
                         element="component|my-section"
                         data-library-version="1"
                         class="fr-section-component">
                <xbl:handlers>
                    <fr:listener
                        version="2018.2"
                        events="value-changed"
                        controls="choice"
                        actions="modify-rows"/>
                </xbl:handlers>
                <xbl:implementation>
                    <xf:model id="my-section-model">
                        <xf:instance id="fr-form-template">
                            <my-section>
                                <grid-1>
                                    <choice/>
                                </grid-1>
                                <rep-grid>
                                    <rep-grid-iteration>
                                        <rep-control/>
                                    </rep-grid-iteration>
                                </rep-grid>
                            </my-section>
                        </xf:instance>
                        <xf:bind id="fr-form-binds" ref="instance('fr-form-instance')">
                            <xf:bind id="grid-1-bind" ref="grid-1" name="grid-1">
                                <xf:bind id="choice-bind" ref="choice" name="choice"/>
                            </xf:bind>
                            <xf:bind id="rep-grid-bind" ref="rep-grid" name="rep-grid">
                                <xf:bind id="rep-grid-iteration-bind" ref="rep-grid-iteration" name="rep-grid-iteration">
                                    <xf:bind id="rep-control-bind" ref="rep-control" name="rep-control"/>
                                </xf:bind>
                            </xf:bind>
                        </xf:bind>
                        <xf:instance xxf:readonly="true" xxf:exclude-result-prefixes="#all" id="rep-grid-template">
                            <rep-grid-iteration>
                                <rep-control/>
                            </rep-grid-iteration>
                        </xf:instance>
                        <xf:instance id="fr-form-resources" xxf:readonly="true">
                            <resources>
                                <resource xml:lang="en">
                                    <my-section><label>My Section</label></my-section>
                                    <choice><label>Choice</label><hint/></choice>
                                    <rep-control><label>Rep control</label><hint/></rep-control>
                                </resource>
                            </resources>
                        </xf:instance>
                        <xf:instance id="fr-form-metadata" xxf:readonly="true">
                            <metadata/>
                        </xf:instance>
                        <fr:action name="modify-rows" version="2018.2">
                            <fr:if condition="$choice = 'add'">
                                <fr:repeat-add-iteration repeat="rep-grid"/>
                            </fr:if>
                            <fr:if condition="$choice = 'remove'">
                                <fr:repeat-remove-iteration repeat="rep-grid"/>
                            </fr:if>
                            <fr:if condition="$choice = 'clear'">
                                <fr:repeat-clear repeat="rep-grid"/>
                            </fr:if>
                        </fr:action>
                    </xf:model>
                </xbl:implementation>
                <xbl:template>
                    <xf:group appearance="xxf:internal" model="my-section-model" id="fr-section-template-view">
                        <fr:grid id="grid-1-grid" bind="grid-1-bind">
                            <fr:c x="1" y="1" w="12">
                                <xf:input id="choice-control" bind="choice-bind">
                                    <xf:label ref="$form-resources/choice/label"/>
                                    <xf:hint ref="$form-resources/choice/hint"/>
                                    <xf:alert ref="$fr-resources/detail/labels/alert"/>
                                </xf:input>
                            </fr:c>
                        </fr:grid>
                        <fr:grid id="rep-grid-grid" bind="rep-grid-bind" repeat="content" min="1" template="instance('rep-grid-template')">
                            <fr:c x="1" y="1" w="12">
                                <xf:input id="rep-control-control" bind="rep-control-bind">
                                    <xf:label ref="$form-resources/rep-control/label"/>
                                    <xf:hint ref="$form-resources/rep-control/hint"/>
                                    <xf:alert ref="$fr-resources/detail/labels/alert"/>
                                </xf:input>
                            </fr:c>
                        </fr:grid>
                    </xf:group>
                </xbl:template>
            </xbl:binding>
        </xbl:xbl>
    </xh:head>
    <xh:body>
        <fr:view>
            <fr:body xmlns:xbl="http://www.w3.org/ns/xbl" xmlns:p="http://www.orbeon.com/oxf/pipeline">
                <fr:section id="my-section-section" bind="my-section-bind">
                    <xf:label ref="$form-resources/my-section/label"/>
                    <component:my-section xmlns="http://orbeon.org/oxf/xml/form-builder"
                                          xmlns:component="http://orbeon.org/oxf/xml/form-builder/component/tests/library"
                                          id="my-section-content-control"/>
                </fr:section>
            </fr:body>
        </fr:view>
    </xh:body>
</xh:html>
