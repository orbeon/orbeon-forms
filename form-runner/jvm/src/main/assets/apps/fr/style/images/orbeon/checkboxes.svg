<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: rgba(16, 67, 168, 0.08); stroke: rgba(16, 67, 168, 0.22); stroke-width: 1.5; }
    .glyph { stroke: #1043a8; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: rgba(96, 152, 248, 0.12); stroke: rgba(96, 152, 248, 0.28); }
      .glyph { stroke: #8bb2f5; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14"/>
  <g class="glyph" transform="translate(16, 16)">
    <rect x="3" y="3" width="9" height="9" rx="2"/>
    <rect x="18" y="3" width="9" height="9" rx="2"/>
    <rect x="18" y="18" width="9" height="9" rx="2"/>
    <rect x="3" y="18" width="9" height="9" rx="2"/>
    <polyline points="6 7.5 7.5 9 10 6"/>
  </g>
</svg>
