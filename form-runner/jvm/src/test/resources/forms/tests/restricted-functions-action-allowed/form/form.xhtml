<xh:html xmlns:xh="http://www.w3.org/1999/xhtml"
         xmlns:xf="http://www.w3.org/2002/xforms"
         xmlns:xs="http://www.w3.org/2001/XMLSchema"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xmlns:ev="http://www.w3.org/2001/xml-events"
         xmlns:xxf="http://orbeon.org/oxf/xml/xforms"
         xmlns:fr="http://orbeon.org/oxf/xml/form-runner">
    <xh:head>
        <xh:title>Restricted Functions: Action Allowed</xh:title>
        <xf:model id="fr-form-model" xxf:expose-xpath-types="true">

            <xf:instance id="fr-form-instance" xxf:exclude-result-prefixes="#all" xxf:index="id">
                <form>
                    <section-1>
                        <source>Input</source>
                        <target/>
                        <target-20182/>
                    </section-1>
                </form>
            </xf:instance>

            <xf:bind id="fr-form-binds" ref="instance('fr-form-instance')">
                <xf:bind id="section-1-bind" ref="section-1" name="section-1">
                    <xf:bind id="source-bind" ref="source" name="source"/>
                    <xf:bind id="target-bind" ref="target" name="target"/>
                    <xf:bind id="target-20182-bind" ref="target-20182" name="target-20182"/>
                </xf:bind>
            </xf:bind>

            <xf:action event="xforms-ready" ev:observer="fr-form-model">
                <xf:setvalue ref="instance('fr-form-instance')/section-1/target" value="concat('Action', ' ', 'Executed')"/>
            </xf:action>

            <fr:listener
                version="2018.2"
                events="form-load-after-controls"
                actions="my-20182-action"/>

            <fr:action name="my-20182-action" version="2018.2">
                <fr:if condition="$source = 'Input'">
                    <fr:control-setvalue value="concat($source, ' Processed')" control="target-20182"/>
                </fr:if>
            </fr:action>

            <xf:instance xxf:readonly="true" id="fr-form-metadata" xxf:exclude-result-prefixes="#all">
                <metadata>
                    <application-name>tests</application-name>
                    <form-name>restricted-functions-action-allowed</form-name>
                    <title xml:lang="en">Restricted Functions Action Allowed</title>
                </metadata>
            </xf:instance>

            <xf:instance id="fr-form-resources" xxf:readonly="true">
                <resources>
                    <resource xml:lang="en">
                        <section-1><label>Section 1</label></section-1>
                        <source><label>Source</label></source>
                        <target><label>Target</label></target>
                        <target-20182><label>Target 2018.2</label></target-20182>
                    </resource>
                </resources>
            </xf:instance>

        </xf:model>
    </xh:head>
    <xh:body>
        <fr:view>
            <fr:body>
                <fr:section id="section-1-section" bind="section-1-bind">
                    <fr:grid id="grid-1-grid">
                        <fr:c y="1" x="1" w="4">
                            <xf:input id="source-control" bind="source-bind">
                                <xf:label ref="$form-resources/source/label"/>
                            </xf:input>
                        </fr:c>
                        <fr:c y="1" x="5" w="4">
                            <xf:output id="target-control" bind="target-bind">
                                <xf:label ref="$form-resources/target/label"/>
                            </xf:output>
                        </fr:c>
                        <fr:c y="1" x="9" w="4">
                            <xf:output id="target-20182-control" bind="target-20182-bind">
                                <xf:label ref="$form-resources/target-20182/label"/>
                            </xf:output>
                        </fr:c>
                    </fr:grid>
                </fr:section>
            </fr:body>
        </fr:view>
    </xh:body>
</xh:html>
