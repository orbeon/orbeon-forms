<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: rgba(16, 67, 168, 0.08); stroke: rgba(16, 67, 168, 0.22); stroke-width: 1.5; }
    .glyph { stroke: #1043a8; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .knob { fill: #1043a8; stroke: #1043a8; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: rgba(96, 152, 248, 0.12); stroke: rgba(96, 152, 248, 0.28); }
      .glyph { stroke: #8bb2f5; }
      .knob { fill: #8bb2f5; stroke: #8bb2f5; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14"/>
  <g class="glyph" transform="translate(16, 16)">
    <line x1="6" y1="28" x2="6" y2="4"/>
    <line x1="16" y1="28" x2="16" y2="4"/>
    <line x1="26" y1="28" x2="26" y2="4"/>
    <circle class="knob" cx="6" cy="18" r="3.2"/>
    <circle class="knob" cx="16" cy="10" r="3.2"/>
    <circle class="knob" cx="26" cy="21" r="3.2"/>
  </g>
</svg>
