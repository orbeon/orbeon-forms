<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .bg { fill: rgba(124, 58, 237, 0.14); stroke: rgba(124, 58, 237, 0.30); stroke-width: 1.5; }
    .glyph { stroke: #6d28d9; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: rgba(167, 139, 250, 0.18); stroke: rgba(167, 139, 250, 0.35); }
      .glyph { stroke: #c4b5fd; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14"/>
  <g class="glyph" transform="translate(16, 16)">
    <rect x="4" y="4" width="24" height="24" rx="3"/>
    <line x1="4" y1="12" x2="28" y2="12"/>
    <line x1="12" y1="12" x2="12" y2="28"/>
    <line x1="16" y1="18" x2="24" y2="18"/>
    <line x1="16" y1="23" x2="21" y2="23"/>
  </g>
</svg>
